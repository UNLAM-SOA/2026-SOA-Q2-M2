listener 1883
allow_anonymous false
password_file /tmp/powershare/passwords
acl_file /tmp/powershare/acl
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type subscribe
# Disponibilidad retained; firmware y gateway rechazan comandos retained al suscribirse.
retain_available true
